name: Bug report
description: 报告可复现的计算、账本或文档问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请勿提交真实出生信息或其他个人隐私；使用虚构或脱敏数据复现。
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 实际发生了什么？预期应该是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现步骤
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      placeholder: v2.0.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本、Codex 客户端版本等
